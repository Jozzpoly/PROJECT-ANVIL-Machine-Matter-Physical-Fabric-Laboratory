name: ANVIL P05 Renderer Technology Proof

on:
  push:
    branches:
      - spike/studio-p05-renderer-proof-2026-08-21

concurrency:
  group: anvil-p05-renderer-proof
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renderer-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install canonical repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install disposable renderer candidates without changing project manifest
        run: npm install --no-save --package-lock=false three@0.185.1 @babylonjs/core@9.21.2
      - name: Preserve accepted ANVIL regression surface
        run: npm run check
      - name: Preserve production browser build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run identical renderer technology probes
        run: mkdir -p p05-results && npx playwright test --config=playwright.p05.config.ts
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p05-renderer-proof
          path: p05-results
          if-no-files-found: warn
          retention-days: 7
