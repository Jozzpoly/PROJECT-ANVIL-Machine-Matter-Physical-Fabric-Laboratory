name: ANVIL P04 Studio Boundary Probes

on:
  push:
    branches:
      - spike/studio-p04-boundary-probes-2026-08-21

concurrency:
  group: anvil-p04-studio-boundary-probes
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: boundary-probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact spike
        uses: actions/checkout@v7

      - name: Use canonical Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and run all Node + real-Box3D tests
        run: npm run check

      - name: Build production browser laboratory unchanged
        run: npm run build
