name: ANVIL CI

on:
  push:
    branches:
      - main
      - "experiment/**"
      - "foundation/**"
  pull_request:

concurrency:
  group: anvil-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v4

      - name: Use canonical Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and run foundation + semantic + Box3D tests
        run: npm run check

      - name: Build browser laboratory
        run: npm run build

      - name: Validate packaged Windows owner launcher
        shell: pwsh
        run: ./dist/serve-anvil.ps1 -SelfTest

      - name: Install Chromium for runtime evidence
        run: npx playwright install --with-deps chromium

      - name: Run real browser evidence gate
        run: npm run test:browser

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: anvil-browser-laboratory
          path: dist
          if-no-files-found: error
          retention-days: 14
