name: ANVIL CI

on:
  push:
    branches:
      - main
      - "experiment/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v4

      - name: Use canonical Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund

      - name: Export canonical dependency lock while bootstrapping
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Typecheck and run semantic + Box3D smoke tests
        run: npm run check

      - name: Build browser laboratory
        run: npm run build

      - name: Install Chromium for runtime evidence
        run: npx playwright install --with-deps chromium

      - name: Run real browser evidence gate
        run: npm run test:browser

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: anvil-00-collapse-browser
          path: dist
          if-no-files-found: error
          retention-days: 14
