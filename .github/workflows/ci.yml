name: ANVIL CI

on:
  push:
    branches:
      - main
      - "experiment/**"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v4

      - name: Use canonical Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Install exact direct dependencies
        run: npm install --no-audit --no-fund

      - name: Commit canonical dependency lock once
        if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/anvil-00-collapse'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Pin canonical dependency graph [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Typecheck and run semantic + Box3D smoke tests
        run: npm run check

      - name: Build browser laboratory
        run: npm run build

      - name: Install Chromium for runtime evidence
        run: npx playwright install --with-deps chromium

      - name: Run real browser evidence gate
        run: npm run test:browser

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: anvil-00-collapse-browser
          path: dist
          if-no-files-found: error
          retention-days: 14
