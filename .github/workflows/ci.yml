name: ANVIL CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".anvil/**"
      - "docs/**"
      - "AGENTS.md"
      - "AI_PROJECT_MEMORY.md"
      - "README.md"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: anvil-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v7

      - name: Use canonical Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and run foundation + semantic + Box3D tests
        run: npm run check

      - name: Build production browser laboratory
        run: npm run build

      - name: Stage exact browser build for candidate gate
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/upload-artifact@v7
        with:
          name: anvil-browser-staging
          path: dist
          if-no-files-found: error
          retention-days: 1

  candidate:
    name: candidate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposal
        uses: actions/checkout@v7

      - name: Use canonical Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download exact build produced by core gate
        uses: actions/download-artifact@v7
        with:
          name: anvil-browser-staging
          path: dist

      - name: Validate packaged Windows owner launcher
        shell: pwsh
        run: ./dist/serve-anvil.ps1 -SelfTest

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Run real browser regression gate
        run: npm run test:browser

      - name: Upload R2 E1 visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r2-e1-visual-evidence
          path: test-results/r2-e1-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload owner-candidate browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: anvil-browser-laboratory
          path: dist
          if-no-files-found: error
          retention-days: 14
